[package]
name = "phaseup"
default-run = "phaseup"
version = "0.4.5"
edition = "2021"

[dependencies]
macroquad = "0.4.16"
serde_json = "1"
eframe = { version = "0.29", optional = true, features = ["persistence"] }

[features]
developer-tools = []
ui-designer = ["dep:eframe"]

[[bin]]
name = "phaseup-designer"
path = "src/bin/phaseup_designer.rs"
required-features = ["ui-designer"]

# Android sideload build; bundled artwork works offline.
[package.metadata.android]
package_name = "com.etherealproject3d.phaseup.dev"
label = "PhaseUP 0.4.5 dev"
version_name = "0.4.5-dev"
version_code = 40501
fullscreen = true
assets = "assets/"
android_version = 35
target_sdk_version = 28
min_sdk_version = 26
build_targets = ["aarch64-linux-android"]

[package.metadata.android.activity_attributes]
"android:exported" = "true"
"android:screenOrientation" = "landscape"
