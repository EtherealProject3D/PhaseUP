name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Build Windows executable
        run: cargo build --release

      - name: Package Windows build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "manual-${{ github.run_number }}"
          }
          $archive = "PhaseUP-$version-Windows.zip"
          ./scripts/package-windows.ps1 -Tag $version
          "ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhaseUP-Windows
          path: ${{ env.ARCHIVE }}

      - name: Prepare GitHub release draft
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "$env:ARCHIVE" --repo "${{ github.repository }}" --clobber
          } else {
            gh release create $tag "$env:ARCHIVE" --repo "${{ github.repository }}" --title "PhaseUP $tag" --generate-notes --draft
          }
