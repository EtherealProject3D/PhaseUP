name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

      - name: Build Windows executable
        run: cargo build --release --locked

      - name: Package Windows build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "manual-${{ github.run_number }}"
          }
          $archive = "PhaseUP-$version-Windows.zip"
          Compress-Archive -Path "target/release/phaseup.exe" -DestinationPath $archive -Force
          "ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhaseUP-Windows
          path: ${{ env.ARCHIVE }}

      - name: Publish GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "$env:ARCHIVE" --repo "${{ github.repository }}" --title "PhaseUP ${{ github.ref_name }}" --generate-notes --prerelease
