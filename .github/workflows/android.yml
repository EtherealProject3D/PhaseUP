name: Android APK (flight build)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sideloadable APK
        run: |
          docker run --rm -v "$PWD:/root/src" -w /root/src notfl3/cargo-apk sh -c '
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0"
            cargo quad-apk build --release
          '
      - name: List APK outputs
        run: find target/android-artifacts/release/apk -type f -name '*.apk' -print
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhaseUP-Android-APK
          path: target/android-artifacts/release/apk/*.apk
          if-no-files-found: error
