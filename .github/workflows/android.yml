name: Android APK (flight build)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Android SDK and Rust
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-29" "build-tools;35.0.0"
          rustup toolchain install 1.95.0 --profile minimal
          rustup +1.95.0 target add aarch64-linux-android
          echo "NDK_HOME=$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Install cargo-quad-apk
        run: cargo +1.95.0 install --git https://github.com/hoklims/cargo-quad-apk --locked cargo-quad-apk
      - name: Build sideloadable APK
        run: cargo +1.95.0 quad-apk build --release
      - name: List APK outputs
        run: find target/android-artifacts/release/apk -type f -name '*.apk' -print
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhaseUP-Android-APK
          path: target/android-artifacts/release/apk/*.apk
          if-no-files-found: error
